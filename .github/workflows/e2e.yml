# E2E / API / Smoke — Playwright
#
# This workflow does NOT build or start the Next.js app. BASE_URL must point to a
# running deployment (staging, preview, production) reachable from GitHub-hosted runners.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   Required:
#     BASE_URL                  — e.g. https://your-app.vercel.app
#     TEST_USER_EMAIL           — Clerk test user
#     TEST_USER_PASSWORD
#     NEXT_PUBLIC_CONVEX_URL    — Convex deployment URL (ConvexClient)
#   Optional:
#     CLERK_SECRET_KEY          — Backend API (temporary users in some E2E specs)
#     API_URL                   — defaults to BASE_URL in config/endpoints.ts
#     CLERK_API_URL             — defaults to https://api.clerk.com/v1
#     STRIPE_SECRET_KEY         — only if specs hit Stripe test mode (see event-cancellation)
#
# Fork PRs: secrets are not available to workflows from forks (GitHub default).

name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # upload-artifact (HTML report)

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      API_URL: ${{ secrets.API_URL }}
      CLERK_API_URL: ${{ secrets.CLERK_API_URL }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Project uses Desktop Chrome only — skip firefox/webkit for speed
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Single Playwright invocation: setup → smoke once, then api + e2e (no duplicate smoke per step)
      - name: Run smoke, API, and E2E tests
        run: npm run test:ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
